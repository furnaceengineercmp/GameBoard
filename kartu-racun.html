<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kartu Racun</title>
<style>
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#2b2160,#0d1020 65%) fixed;color:#eee;padding:12px;max-width:720px;margin:auto}
h2{text-align:center;letter-spacing:3px;background:linear-gradient(90deg,#f59e0b,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent}
button,input{font:inherit;padding:9px 14px;border-radius:10px;border:0;margin:3px}input{background:#fff;color:#111}
button{background:linear-gradient(#4f8cff,#2563eb);color:#fff;cursor:pointer;transition:.15s}button:hover{transform:translateY(-2px)}button:disabled{opacity:.4;transform:none}
.box{background:#1b1f33cc;padding:12px;border-radius:14px;margin:10px 0;border:1px solid #ffffff14}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:4px;cursor:pointer;border:3px solid transparent;transition:.15s}.sw.on{border-color:#fff;transform:scale(1.25)}
.pl{display:inline-block;padding:7px 12px;border-radius:12px;margin:4px;background:#262b45;border-left:7px solid var(--c)}
.pl.turn{animation:pulse 1s infinite;box-shadow:0 0 14px var(--c)}.pl.dead{opacity:.35;filter:grayscale(1)}
@keyframes pulse{50%{transform:scale(1.07)}}
.table{text-align:center}.tn{font-size:68px;font-weight:900;line-height:1.1;animation:pop .45s}
@keyframes pop{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
.mine{color:#fde047;font-weight:700;animation:pulse 1s infinite}
.hand{display:flex;flex-wrap:wrap;justify-content:center;padding:18px 0 6px}
.card{width:80px;height:114px;margin:0 -5px;border-radius:12px;position:relative;color:#fff;font-weight:900;text-align:center;box-shadow:0 5px 12px #000a;cursor:pointer;transition:.2s;animation:deal .45s backwards;border:3px solid #fff;user-select:none;overflow:hidden}
.card:hover{transform:translateY(-18px) scale(1.08)!important;z-index:5}.noanim{animation:none}
.card .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-style:normal}
.card .big{position:relative;font-size:46px;line-height:84px;text-shadow:0 2px 6px #000a}.card .sm{position:absolute;left:6px;top:2px;font-size:13px;z-index:1;text-shadow:0 1px 3px #000}
.card .nm{position:absolute;bottom:0;left:0;width:100%;font-size:10px;background:#000a;padding:3px 0}
.card.off{filter:grayscale(.85) brightness(.55)}.mini{width:60px;height:86px;margin:6px auto;display:inline-block;animation:none;cursor:default}.mini:hover{transform:none!important}
.mini .big{font-size:32px;line-height:62px}.mini .bg{font-size:40px}.mini .nm{font-size:8px}
@keyframes deal{from{transform:translateY(-140px) scale(.3);opacity:0}}
body.shake{animation:sh .5s}@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
#log{font-size:13px;color:#aab}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fld label{display:block;font-size:12px;color:#aab;margin-bottom:4px}.fld input{width:100%;box-sizing:border-box;text-align:center;font-size:18px;font-weight:700;margin:0}
.jg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}.jc{border-radius:12px;padding:10px;text-align:center;border:1px solid #ffffff22;transition:.2s}.jc:hover{transform:translateY(-3px)}.jc.off{opacity:.4;filter:grayscale(.8)}
.jc .ic{font-size:28px}.jc .jn{font-size:12px;font-weight:700;margin:2px 0 8px}.st{display:flex;align-items:center;justify-content:center;gap:6px}.st button{width:32px;height:32px;padding:0;margin:0;border-radius:50%;font-size:18px}.st input{width:48px;text-align:center;margin:0;padding:6px 0;font-weight:700}
.sum{margin-top:14px;padding:9px 12px;border-radius:10px;background:#0006;font-size:13px}summary{cursor:pointer}@media(max-width:480px){.g3{grid-template-columns:1fr}}

.gpick{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.gcard{flex:1;min-width:150px;padding:14px;border-radius:14px;border:2px solid #ffffff22;background:#ffffff0d;cursor:pointer;text-align:center;transition:.2s;font-size:26px}.gcard b{display:block;font-size:15px;margin-top:4px}.gcard small{display:block;font-size:11px;opacity:.7;margin-top:2px}.gcard:hover{transform:translateY(-3px)}.gcard.on{border-color:#f59e0b;box-shadow:0 0 16px #f59e0b88;background:#f59e0b22}
.kt{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;background:linear-gradient(90deg,#f59e0b,#ef4444);color:#1a0f00;font-weight:800;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px #000a;max-width:90vw;text-align:center;animation:pop .3s;transition:opacity .4s}.kt.out{opacity:0}
.bbtable{position:relative;width:100%;max-width:780px;height:470px;margin:0 auto}.bbfelt{position:absolute;inset:14% 9%;border-radius:50%;background:radial-gradient(ellipse at center,#1f7a45,#0d3b22 70%);border:5px solid #7c4a1d;box-shadow:inset 0 0 50px #000b,0 8px 30px #000a}
.bbmid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;text-align:center;font-size:14px;line-height:1.5;text-shadow:0 2px 4px #000}
.bbseat{position:absolute;transform:translate(-50%,-50%);background:#1b1f33ee;border:2px solid var(--c);border-radius:12px;padding:5px 8px;min-width:92px;text-align:center;font-size:12px;z-index:2;transition:.25s}.bbseat.turn{box-shadow:0 0 16px var(--c);animation:pulse 1.2s infinite}.bbseat.dead{opacity:.4;filter:grayscale(1)}.bbseat.chal{outline:2px dashed #fde047}
.bbn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}.bbi{font-size:11px;margin-top:2px}.pass{background:#475569;border-radius:6px;padding:1px 5px;font-size:10px}.bidb{background:#f59e0b;color:#1a0f00;border-radius:6px;padding:1px 5px;font-size:10px;font-weight:800}
.bbstk{display:flex;justify-content:center;margin-top:4px;min-height:36px;align-items:center;padding-left:8px}.bbstk.can{cursor:pointer;outline:2px dashed #fde047;border-radius:6px}.bbe{opacity:.4;font-size:10px}
.bc{display:inline-block;width:26px;height:36px;border-radius:5px;margin-left:-8px;background:linear-gradient(#4338ca,#1e1b4b);border:1px solid #fff9;font-style:normal;text-align:center;line-height:36px;font-size:16px;box-shadow:0 2px 4px #0008;animation:pop .3s}.bc.x::after{content:'?';color:#ffffff88;font-size:13px}.bc.f{background:linear-gradient(#ec4899,#9d174d)}.bc.b{background:linear-gradient(#ef4444,#7f1d1d)}.bc.g{background:linear-gradient(#fbbf24,#b45309)}
.bbhand{font-size:18px;margin:6px 0;font-weight:700}
@media(max-width:520px){.bbtable{height:420px}.bbseat{min-width:76px;font-size:11px;padding:4px 5px}.bc{width:20px;height:28px;line-height:28px;font-size:13px}}
.kb{background:#dc2626;padding:2px 8px;margin:0 0 0 6px;font-size:12px}#chm{max-height:150px;overflow:auto;font-size:13px;margin:6px 0}#ask{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;z-index:9}#ask:empty{display:none}
</style></head><body>
<h2>🃏 KARTU RACUN ☠️</h2><div id="app"></div><div id="ask"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyDULY7ywPxyxoO7UBSGY0jGcMcqXd7tWVA",authDomain:"game-board-b7ff8.firebaseapp.com",databaseURL:"https://game-board-b7ff8-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"game-board-b7ff8",appId:"1:162301062884:web:042b1b625d747e0b6386f1"};
firebase.initializeApp(CFG);const db=firebase.database(),$=s=>document.querySelector(s);
const JK={reset:'Reset 0',pick:'Pilih Angka',skip:'Skip',bomb:'Bom',lose:'Curi Kartu',swap:'Tukar Tangan',shuf:'Kocok Semua',life:'+Nyawa',rev:'Balik Arah'};
const JI={reset:'🔄',pick:'🎯',skip:'⏭️',bomb:'💣',lose:'🤏',swap:'🤝',shuf:'🌪️',life:'💖',rev:'↩️'},JH={reset:190,pick:270,skip:45,bomb:0,lose:320,swap:160,shuf:290,life:340,rev:30};
const JD={reset:'Angka meja jadi 0. Pemain berikutnya bebas main 0-10.',pick:'Pilih angka meja baru (1-10) sebagai batas minimum berikutnya.',skip:'Kamu melewati giliranmu sendiri (tidak perlu memainkan angka). Giliran langsung pindah ke pemain berikutnya.',bomb:'SEMUA pemain (termasuk kamu) -1 nyawa, lalu semua kartu diacak ulang.',lose:'Ambil 1 kartu acak dari lawan ke tanganmu, jadi lawan tersisa 2 kartu. Lawan harus punya minimal 2 kartu.',swap:'Tukar SEMUA kartu di tanganmu dengan seluruh kartu di tangan 1 lawan.',shuf:'Kartu semua pemain diacak ulang (jumlah kartu tiap pemain tetap).',life:'Kamu mendapat +1 nyawa (tanpa batas maksimum).',rev:'Arah giliran dibalik, berlaku sampai dibalik lagi.'};
const CI=['🥚','🐣','🐍','🕷️','🦂','🐊','🦈','🐉','👹','💀','☠️'],COL=['#ef4444','#f59e0b','#22c55e','#06b6d4','#3b82f6','#a855f7','#ec4899','#f8fafc'];
let me,code,R,meta,players={},game={},hand=[],G=null,cfgBuilt=0,bye=0,joined=0,col=localStorage.col||COL[4],lk='',lh='',lt=null,pl_={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),nm=u=>esc(players[u]?.name||'?'),norm=s=>s.trim().toUpperCase().replace(/[.#$\[\]\/\s]+/g,'-');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
firebase.auth().signInAnonymously().then(c=>{me=c.user.uid;home()});

let gmGame='racun',rulesSet=0;
function home(){$('#app').innerHTML=`<div class=box><b>👤 Profil kamu</b><br><input id=n placeholder="Nama kamu" maxlength=14 value="${esc(localStorage.nm||'')}"><br>Warna: <span id=sws></span></div>
<div class=box><b>🚪 Gabung room</b><br><input id=c placeholder="Kode / nama room"><button onclick=jn()>Gabung</button></div>
<div class=box><b>👑 Game Master</b><br><small style="color:#aab">Khusus Game Master: pilih game, buat room, dan kelola room.</small><br><input id=pw type=password placeholder="Password GM" onkeydown="if(event.keyCode==13)gmLogin()"><button onclick=gmLogin()>Masuk Panel GM</button></div>`;sw()}
async function gmLogin(){if(!prof())return;try{await db.ref('gmAuth/'+me).set($('#pw').value)}catch(e){return alert('Password GM salah')}gmPanel()}
function gmPanel(){$('#app').innerHTML=`<div class=box><b>👑 Panel Game Master</b> <small style="color:#aab">(${esc(localStorage.nm||'')})</small> <button class=kb style="background:#475569" onclick=home()>⬅ Keluar panel</button></div>
<div class=box><b>1. Pilih game</b><div class=gpick><div class=gcard id=gp_racun onclick="gmPick('racun')">🃏<b>Kartu Racun</b><small>Main kartu angka &amp; joker, nyawa, reset racun</small></div><div class=gcard id=gp_bb onclick="gmPick('bb')">🌸💣<b>Bunga &amp; Bom</b><small>Bluff &amp; tebak jumlah bunga di meja melingkar</small></div></div></div>
<div class=box><b>2. Buat room</b><br><input id=rc placeholder="Nama / kode room baru"><button onclick=mk()>Buat Room</button><div class=muted style="font-size:12px">Setelah room dibuat kamu otomatis masuk dan bisa ikut bermain.</div></div>
<div class=box><b>3. Kelola room</b> <button onclick=rooms()>🔄 Muat ulang</button><div id=rl></div></div>`;gmPick(gmGame);rooms()}
function gmPick(g){gmGame=g;['racun','bb'].forEach(x=>{const e=$('#gp_'+x);if(e)e.classList.toggle('on',x===g)})}
function sw(){$('#sws').innerHTML=COL.map(c=>`<span class="sw ${c==col?'on':''}" style="background:${c}" onclick="col='${c}';sw()"></span>`).join('')}
function prof(){const el=$('#n'),n=el?el.value.trim():(localStorage.nm||'');if(!n){alert('Isi nama dulu');return 0}localStorage.nm=n;localStorage.col=col;return n}
async function mk(){code=norm($('#rc').value);if(!code)return alert('Isi nama/kode room');
 const s=await db.ref('rooms/'+code+'/meta').once('value');if(s.exists())return alert('Nama room sudah ada. Pakai nama lain, atau masuk/hapus lewat "Kelola room".');
 try{await db.ref('rooms/'+code+'/meta').set({gm:me,state:'lobby',game:gmGame});await db.ref('roomIndex/'+code).set({gm:me,t:Date.now(),game:gmGame})}catch(e){return alert('Gagal membuat room (login ulang sebagai Game Master)')}join()}
async function rooms(){let v;try{v=(await db.ref('roomIndex').once('value')).val()||{}}catch(e){return $('#rl').innerHTML='Gagal memuat daftar room (masuk ulang panel GM).'}
 const ks=Object.keys(v).sort((a,b)=>v[b].t-v[a].t);
 $('#rl').innerHTML=ks.length?ks.map(c=>`<div class=pl style="--c:#888" data-c="${esc(c)}">${v[c].game==='bb'?'🌸💣':'🃏'} <b>${esc(c)}</b> <small>${new Date(v[c].t).toLocaleString('id-ID')}</small> <button onclick="enter(this.parentNode.dataset.c)">Masuk</button><button style="background:#dc2626" onclick="del(this.parentNode.dataset.c)">Hapus</button></div>`).join(''):'Belum ada room.'}
function enter(c){if(!prof())return;code=c;join()}
async function del(c){if(!confirm('Hapus room '+c+' beserta isinya?'))return;await db.ref('roomIndex/'+c).remove();await db.ref('rooms/'+c).remove();rooms()}
async function delMine(){if(!confirm('Hapus room '+code+'? Semua pemain akan keluar.'))return;bye=1;await db.ref('roomIndex/'+code).remove();await db.ref('rooms/'+code).remove();location.reload()}
function jn(){if(!prof())return;code=norm($('#c').value);db.ref('rooms/'+code+'/meta').once('value',s=>s.exists()?join():alert('Room tidak ditemukan'))}
async function join(){R=db.ref('rooms/'+code);if((await R.child('kicked/'+me).once('value')).val()){alert('Kamu dikeluarkan dari room ini oleh Game Master');return home()}
 R.child('players/'+me).update({name:localStorage.nm,color:col,ready:false,kicked:null});
 $('#app').innerHTML='<div id=top></div><div id=rules></div><div id=pl class=box></div><div id=cfg></div><div id=hd></div><div id=lg class=box></div><div id=cht class=box><b>💬 Chat room</b><div id=chm></div><input id=chi placeholder="Ketik pesan…" maxlength=120 style="width:65%" onkeydown="if(event.keyCode==13)chat()"><button onclick=chat()>Kirim</button></div>';
 R.child('meta').on('value',s=>{meta=s.val();if(!meta){if(!bye)alert('Room ini sudah dihapus');location.reload();return}if(!rulesSet){rulesSet=1;$('#rules').innerHTML=meta.game==='bb'?bbRules():racunRules();GBM.set(meta.game==='bb'?'bb':'kr')}if(meta.gm===me&&!cfgBuilt){cfgBuilt=1;buildCfg();host()}render()});
 R.child('players').on('value',s=>{players=s.val()||{};if(players[me])joined=1;if(joined&&meta&&(!players[me]||players[me].kicked)){alert('Kamu dikeluarkan oleh Game Master');location.reload();return}render()});
 R.child('chat').limitToLast(30).on('value',s=>{const a=[];s.forEach(x=>{a.push(x.val())});const m=$('#chm');if(m){m.innerHTML=a.map(x=>`<div><b style="color:${esc(x.c)}">${esc(x.n)}</b>: ${esc(x.t)}</div>`).join('');m.scrollTop=m.scrollHeight}});
 R.child('game').on('value',s=>{game=s.val()||{};render()});
 R.child('hands/'+me).on('value',s=>{const hv=s.val();bbHand=(hv&&!Array.isArray(hv))?Object.assign({f:0,b:0,g:0},hv):{f:0,b:0,g:0};hand=Array.isArray(hv)?hv:[];if(bbHand.msg&&bbHand.msg!==lastMsg){lastMsg=bbHand.msg;kt(bbHand.msg.split('|')[1]||bbHand.msg)}bbSig='';render()})}
function chat(){const i=$('#chi'),t=i.value.trim();if(!t)return;i.value='';R.child('chat').push({n:localStorage.nm,c:col,t:t.slice(0,120),ts:firebase.database.ServerValue.TIMESTAMP})}
function kick(u){if(!confirm('Keluarkan '+(players[u]?.name||'pemain')+' dari room?'))return;
 R.child('kicked/'+u).set(true);
 if(meta.state==='lobby'){R.child('players/'+u).remove();return}
 if(meta.game==='bb'){bbKick(u);return}
 if(!G||G.over||G.lives[u]<=0){R.child('players/'+u+'/kicked').set(true);return}
 G.discard.push(...H(u));G.hands[u]=[];G.lives[u]=0;log('🚪 '+nm(u)+' dikeluarkan GM');
 const a=alive();if(a.length<2)G.over=a[0]||'draw';else if(G.turn===u)G.turn=nxt(u);
 publish();R.child('players/'+u+'/kicked').set(true)}
const rdy=()=>R.child('players/'+me+'/ready').set(!players[me].ready);
function buildCfg(){return meta&&meta.game==='bb'?bbBuildCfg():buildCfgRacun()}
function buildCfgRacun(){$('#cfg').innerHTML=`<details class=box open oninput=cfgSum()><summary><b>⚙️ Pengaturan Game Master</b></summary>
<div class=g3 style="margin-top:12px"><div class=fld><label>❤️ Nyawa awal</label><input id=c_l type=number min=1 value=2></div><div class=fld><label>🃏 Multiplier deck</label><input id=c_m type=number min=1 value=2></div><div class=fld><label>🎭 Joker %</label><input id=c_j type=number min=0 max=60 value=20></div></div>
<div style="margin:16px 0 4px"><b>Bobot joker</b> <small style="color:#aab">(0 = nonaktif, makin besar makin sering muncul)</small></div>
<div class=jg>`+Object.keys(JK).map(k=>`<div class=jc id=jc_${k} style="background:linear-gradient(145deg,hsl(${JH[k]} 55% 30%),hsl(${JH[k]} 55% 16%))"><div class=ic>${JI[k]}</div><div class=jn>${JK[k]}</div><div class=st><button onclick="stp('w_${k}',-1)">−</button><input id=w_${k} type=number min=0 value=1><button onclick="stp('w_${k}',1)">+</button></div></div>`).join('')+`</div><div id=csum class=sum></div></details>`;cfgSum()}
function stp(id,d){const e=$('#'+id);e.value=Math.max(0,(+e.value||0)+d);cfgSum()}
function cfgSum(){const n=Object.values(players).filter(p=>p.ready).length||2,v=id=>+($('#'+id)||{}).value||0,jr=Math.min(v('c_j'),90),nor=11*n*v('c_m'),J=Math.round(nor*jr/(100-jr));
 Object.keys(JK).forEach(k=>{const c=$('#jc_'+k);if(c)c.classList.toggle('off',!v('w_'+k))});
 const s=$('#csum');if(s)s.innerHTML=`📊 Perkiraan untuk <b>${n}</b> pemain siap: <b>${nor}</b> kartu angka + <b>${J}</b> joker = <b>${nor+J}</b> kartu`}

const cardHtml=(c,cls='',i=0,n=1,off=0)=>{const j=typeof c=='string',h=j?JH[c]:210-c*21;return `<div title="${j?JD[c]:''}" class="card ${cls} ${off?'off':''}" style="background:linear-gradient(145deg,hsl(${h} 75% 52%),hsl(${h} 75% 24%));transform:rotate(${(i-(n-1)/2)*4}deg);animation-delay:${i*60}ms" ${cls=='mini'?'':`onclick=play(${i})`}><i class=bg style="opacity:${j?1:.3}">${j?JI[c]:CI[c]}</i>${j?`<span class=sm>JOKER</span><span class=nm>${JK[c]}</span>`:`<span class=sm>${c}</span><span class=big>${c}</span>`}</div>`};
function render(){if(!meta)return;const gmv=meta.gm===me,st=meta.state,cl=u=>players[u]?.color||'#94a3b8';
 $('#top').innerHTML=`Room <b>${code}</b> ${gmv?'👑 kamu Game Master <button style="background:#dc2626" onclick=delMine()>🗑 Hapus room</button>':''} · bagikan nama room ke teman`;$('#cfg').style.display=gmv&&st==='lobby'?'block':'none';
 if(st==='lobby'){lk='';if(gmv&&$('#csum'))cfgSum();$('#hd').innerHTML=$('#lg').innerHTML='';$('#lg').style.display='none';
  $('#pl').innerHTML='<b>Pemain di room</b><br>'+Object.keys(players).map(u=>`<span class=pl style="--c:${cl(u)}">${players[u].ready?'✅':'⏳'} ${nm(u)}${u===meta.gm?' 👑':''}${gmv&&u!==me?`<button class=kb onclick="kick('${u}')">✖</button>`:''}</span>`).join('')+`<br><button onclick=rdy()>${players[me]?.ready?'Batal Ready':'✋ Ready'}</button>`+(gmv?`<button onclick=start() style="background:linear-gradient(#22c55e,#15803d)">▶ Mulai</button>`:'');return}
 if(meta.game==='bb'){bbRender(gmv,st,cl);return}
 const g=game,o=g.order||[],mine=g.turn===me&&st==='playing';$('#lg').style.display='block';
 o.forEach(u=>{const l=players[u]?.lives;if(pl_[u]>l){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),600)}pl_[u]=l});

 let h=`<div class=bbhand>Kartumu: 🌸×${bbHand.f} &nbsp;💣×${bbHand.b}${bbHand.g?' &nbsp;🌟×'+bbHand.g:''}</div>`;
 const alive=g.alive&&g.alive[me],my=g.turn===me&&!g.winner&&alive,hasC=bbHand.f+bbHand.b+bbHand.g>0;

 if(!alive&&!g.winner)h+='<div class=muted>Kamu sudah tersingkir — menonton.</div>';
 else if(ph==='place'&&my){h+=`<div>Pilih kartu untuk ditaruh:</div><button ${bbHand.f?'':'disabled'} onclick="bbPlace('f')">🌸 Taruh Bunga</button><button ${bbHand.b?'':'disabled'} style="background:linear-gradient(#ef4444,#b91c1c)" onclick="bbPlace('b')">💣 Taruh Bom</button>${bbHand.g?'<button style="background:linear-gradient(#f59e0b,#b45309)" onclick="bbPlace(\'g\')">🌟 Taruh Bunga Emas</button>':''}`+(g.placedAll||!hasC?`<div style="margin-top:8px">Atau mulai bid (1–${tot}): ${stepper(1)}</div>`:'<div class=muted style="margin-top:6px">Bid baru bisa setelah semua pemain menaruh minimal 1 kartu.</div>')}
 else if(ph==='bid'&&my)h+=`<div>Naikkan bid (${g.bid+1}–${tot}) atau pass:</div>${g.bid<tot?stepper(g.bid+1):''} <button style="background:#475569" onclick=bbPass()>✋ Pass</button>`;
 else if(canRev)h+=`<div>Ketuk tumpukan kartu pemain (atau pilih di bawah) untuk membuka kartu teratasnya:</div>`+o.filter(u=>g.alive[u]).map(u=>{const un=((g.stk[u]||[]).filter(c=>c==='x').length),ok=un>0&&(g.ownLeft>0?u===me:true);return `<button ${ok?'':'disabled'} onclick="bbReveal_('${u}')">${u===me?'Kartuku':nm(u)} (${un})</button>`}).join('');
 else if(ph==='discard'&&g.disc===me)h+=`<div>Pilih 1 kartu yang dibuang:</div><button ${bbHand.f?'':'disabled'} onclick="bbDiscard_('f')">🗑 Buang 🌸</button><button ${bbHand.b?'':'disabled'} onclick="bbDiscard_('b')">🗑 Buang 💣</button>`;
 else if(!g.winner)h+=`<div class=muted>Menunggu ${nm(ph==='reveal'?g.chal:ph==='discard'?g.disc:g.turn)}…</div>`;
 $('#hd').innerHTML=h;$('#lg').style.display='block';$('#lg').innerHTML=(g.log||[]).slice().reverse().slice(0,8).join('<br>')}

/* ===== MUSIK LATAR (disintesis langsung di browser, tanpa file audio) ===== */
var GBM=(function(){

  var n=ctx.sampleRate*2;nb=ctx.createBuffer(1,n,ctx.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;}

  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
 function noise(t,dur,vol,freq,type){var s=ctx.createBufferSource();s.buffer=nb;var f=ctx.createBiquadFilter();f.type=type||'highpass';f.frequency.value=freq;var g=ctx.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.05);}

  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.22);}

  bb:{bpm:108,fn:function(s,t,d){var ch=[[60,64,67],[65,69,72],[67,71,74],[64,67,71]][Math.floor(s/8)%4],i=s%8;tone(ch[[0,1,2,1,2,1,2,1][i]]+12,t,d*1.8,'sine',0.08);if(i%4===0)tone(ch[0]-12,t,d*3,'triangle',0.13);if(i===0||i===4)noise(t,0.04,0.05,3000);if(i===2||i===6)tone(96,t,0.08,'square',0.025);if(s%16===15)tone(98,t,0.15,'square',0.04);}},
  menu:{bpm:72,fn:function(s,t,d){var ch=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]][Math.floor(s/8)%4];if(s%8===0)ch.forEach(function(n){tone(n-12,t,d*7,'triangle',0.05,0.6);});
   if(s%2===0)tone(ch[(s/2)%3]+12,t,d*3,'sine',0.06);}},
  kr:{bpm:104,fn:function(s,t,d){var ch=[[57,60,64],[53,57,60],[55,59,62],[52,56,59]][Math.floor(s/8)%4],i=s%8;
   tone(ch[[0,1,2,1,2,1,2,1][i]]+12,t,d*1.6,'square',0.035);if(i===0||i===4)tone(ch[0]-12,t,d*3,'triangle',0.13);if(i===0||i===4)kick(t,0.18);
   if(i%2===1)noise(t,0.05,0.025,7000);if(i===6&&Math.random()<0.4)tone(ch[2]+24,t,d*2,'sine',0.04);}},
  inv:{bpm:78,fn:function(s,t,d){var bar=Math.floor(s/8)%4,root=[50,43,48,45][bar],sw=(s%2)?d*0.28:0,i=s%8;t+=sw;
   if(i%2===0)tone(root+[0,7,4,7][i/2]-12,t,d*1.8,'triangle',0.15);noise(t,0.06,i%2?0.012:0.022,6000);
   if(i===0||i===5)tone(root+[3,7,10,14][Math.floor(Math.random()*4)]+12,t,d*6,'sine',0.07);if(Math.random()<0.12)tone(pick([62,65,67,69,72])+12,t,d*5,'sine',0.05);}},
  sgd:{bpm:64,fn:function(s,t,d){var ch=[[55,58,62],[53,57,60],[51,55,58],[53,57,62]][Math.floor(s/16)%4];if(s%16===0)ch.forEach(function(n){tone(n,t,d*15,'triangle',0.055,1.2);});
   if(s%4===2&&Math.random()<0.7)tone(pick([67,70,72,74,77]),t,d*3,'sine',0.05);}},
  sgn:{bpm:52,fn:function(s,t,d){if(s%16===0){tone(33,t,d*16,'sine',0.14,1.5);tone(33.1,t,d*16,'triangle',0.06,2);}
   if(s%4===0){kick(t,0.22);kick(t+d*0.8,0.14);}if(s%8===3)noise(t,d*7,0.05,420,'bandpass');
   if(Math.random()<0.07)tone(pick([81,82,76,88]),t,d*5,'sine',0.035);}},
  spl:{bpm:116,fn:function(s,t,d){var ch=[[48,52,55],[43,47,50],[45,48,52],[41,45,48]][Math.floor(s/16)%4],i=s%8;tone(ch[[0,2,1,2,0,2,1,2][i]],t,d*1.5,'triangle',0.09);
   tone([72,74,76,77,79,77,76,74,72,76,79,76,72,67,69,71][s%16]+(Math.floor(s/16)%2?0:0),t,d*1.8,'triangle',0.07);if(i===0)tone(ch[0]-12,t,d*6,'sine',0.08);}},
  sah:{bpm:122,fn:function(s,t,d){var i=s%8;if(i%4===0)kick(t,0.2);if(i%2===1)noise(t,0.045,0.03,8000);if(i===6)noise(t,0.03,0.04,10000);
   tone([42,42,54,42,45,42,49,52][i],t,d*0.9,'square',0.05);if(s%2===0)tone(pick([78,81,85,88,90]),t,d*1.6,'sine',0.05);}}
 };
 function sched(){if(!ctx||!on||!theme||!T[theme])return;var th=T[theme],sd=60/th.bpm/2;if(nextT<ctx.currentTime)nextT=ctx.currentTime+0.05;
  while(nextT<ctx.currentTime+0.35){try{th.fn(step,nextT,sd);}catch(e){}step++;nextT+=sd;}}

 function set(n){if(n===theme)return;theme=n;step=0;if(ctx)nextT=ctx.currentTime+0.15;}
 function toggle(){on=!on;try{localStorage.setItem('gb_music',on?'1':'0');}catch(e){}if(on)start();else if(master)master.gain.value=0;return on;}
 function reload(){var v=localStorage.getItem('gb_music')!=='0';if(v!==on){on=v;if(on)start();else if(master)master.gain.value=0;}return on;}
 return {start:start,set:set,toggle:toggle,reload:reload,isOn:function(){return on;}};
})();
