function tick(){var now=performance.now(),dt=Math.min(.1,(now-(S.last||now))/1000);S.last=now;
 if(S.ph==='play'){Object.keys(S.P).forEach(function(k){var p=S.P[k],i=S.inp[k]||{};p.A=!!i.a&&!p.pa;p.pa=!!i.a;if(i.b&&!p.pb)p.emo=1.5;p.pb=!!i.b;if(p.emo>0)p.emo-=dt});
  G.t-=dt;IMPL[S.gid].tick(dt);if(G.done||G.t<=0)finish()}
 else if(S.ph==='intro'){S.T-=dt;if(S.T<=0){S.ph='play'}}
 else if(S.ph==='res'){S.T-=dt;if(S.T<=0){if(S.over)ending();else intro()}}}
/* Data dikirim ringkas: p/e berupa string, info statis (nama, skor, hasil) hanya dikirim saat berubah, host tidak mengunduh datanya sendiri */
var lastInf='',lastK='',lastFx=-1,nt=0;
function parseSt(v){var inf=v.inf||{};['pl','res','tot','fin','tg','n','mode','rm','msg'].forEach(function(k){v[k]=inf[k]});
 var ps=(typeof v.p==='string'?v.p:'').split(';'),P={};(inf.o||[]).forEach(function(id,i){if(ps[i])P[id]=ps[i].split(',').map(Number)});v.p=P;
 v.e=(typeof v.e==='string'&&v.e?v.e.split(';'):[]).map(function(x){var a=x.split(',');return[+a[0],+a[1],+a[2],a[3]||'',a[4]||'',+a[5],+a[6]]});return v}
function bc(){if(!uid)return;var ids=Object.keys(S.P).sort(),pl={};ids.forEach(function(k){var q=S.P[k];pl[k]=[q.n,q.col,q.team]});
 var inf={o:ids,pl:pl,res:S.res,tot:S.tot,fin:S.final||[],tg:cfg.target,n:ids.length,mode:cfg.mode,rm:room,msg:S.msg||''},js=JSON.stringify(inf),chg=js!==lastInf;
 var play=S.ph==='play'&&G,t=Math.ceil(play?G.t:S.T);
 var ps=ids.map(function(k){var q=S.P[k];return[q.x|0,q.y|0,q.al?1:0,q.sc|0,q.emo>0?1:0,q.fin?1:0,q.vx|0,q.vy|0].join(',')}).join(';');
 var es=play?IMPL[S.gid].ents().map(function(e){return e.join(',')}).join(';'):'';
 var v={ph:S.ph,id:S.gid,t:t,R:(G&&G.R)?G.R|0:0,seq:S.seq,p:ps,e:es,fx:S.fx,inf:inf};
 st=parseSt(JSON.parse(JSON.stringify(v)));rcv=performance.now(); // tampilan host dari data lokal
 var key=S.ph+'|'+S.gid+'|'+t+'|'+S.seq;nt++;
 if((play&&nt%2==0)||key!==lastK||chg){lastK=key;var u={ph:v.ph,id:v.id,t:t,R:v.R,seq:v.seq,p:ps,e:es};
  if(S.seq!==lastFx){u.fx=S.fx;lastFx=S.seq}if(chg){u.inf=inf;lastInf=js}R().child('st').update(u)}}
/* ---------- GAMBAR (semua layar) ---------- */
var cv=$('cv'),cx=cv.getContext('2d'),DP={},PA=[],lastSeq=-1,tm=0,stars=[];
for(var i=0;i<60;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()*2+.5]);
function fit(){var d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d}
addEventListener('resize',fit);fit();
function draw(ts){requestAnimationFrame(draw);tm=ts/1000;var d=devicePixelRatio||1,sc=Math.min(cv.width/W,cv.height/H),ox=(cv.width-W*sc)/2,oy=(cv.height-H*sc)/2;
 cx.setTransform(1,0,0,1,0,0);var g=cx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#1e1b4b');g.addColorStop(1,'#0b0620');cx.fillStyle=g;cx.fillRect(0,0,cv.width,cv.height);
 cx.setTransform(sc,0,0,sc,ox,oy);cx.textAlign='center';
 stars.forEach(function(s){cx.fillStyle='rgba(255,255,255,'+(.3+.3*Math.sin(tm*2+s[0]))+')';cx.fillRect(s[0],s[1],s[2],s[2])});
 if(!st){txt('Menghubungkan…',W/2,H/2,28,'#fff');return}
 var ph=st.ph,id=st.id,pl=st.pl||{},P=st.p||{},dtE=Math.min(.25,(performance.now()-rcv)/1000);
 if(st.seq!==undefined&&lastSeq<0)lastSeq=st.seq;(st.fx||[]).forEach(function(f){if(f[0]>lastSeq){lastSeq=f[0];for(var i=0;i<14;i++)PA.push({x:f[1],y:f[2],vx:rnd(-160,160),vy:rnd(-160,160),l:.7,c:f[3]})}});
 if(ph==='play'||ph==='intro')arena(id);
 if(ph==='play'||ph==='intro'){
  (st.e||[]).forEach(function(e){var x=e[0]+e[5]*dtE,y=e[1]+e[6]*dtE;if(e[4]){cx.fillStyle=e[4];cx.beginPath();cx.arc(x,y,e[2],0,7);cx.fill()}if(e[3])txt(e[3],x,y+e[2]*.35,e[2],'#fff')});
  Object.keys(P).forEach(function(k){var q=P[k],dp=DP[k]||(DP[k]={x:q[0],y:q[1]});dp.x+=(q[0]+(q[6]||0)*dtE-dp.x)*.4;dp.y+=(q[1]+(q[7]||0)*dtE-dp.y)*.4;
   if(!q[2]){return}var c=(pl[k]||[])[1]||'#fff';
   if(id==48){cx.strokeStyle=c;cx.lineWidth=4;cx.beginPath();cx.arc(dp.x,dp.y,16,0,7);cx.moveTo(dp.x-24,dp.y);cx.lineTo(dp.x+24,dp.y);cx.moveTo(dp.x,dp.y-24);cx.lineTo(dp.x,dp.y+24);cx.stroke();txt((pl[k]||[''])[0],dp.x,dp.y-28,13,c);return}
   cx.shadowColor=c;cx.shadowBlur=10;cx.fillStyle=c;cx.beginPath();cx.arc(dp.x,dp.y,14+(q[4]?3:0),0,7);cx.fill();cx.shadowBlur=0;cx.strokeStyle='#fff';cx.lineWidth=2.5;cx.stroke();
   cx.fillStyle='#fff';cx.beginPath();cx.arc(dp.x-5,dp.y-3,3.5,0,7);cx.arc(dp.x+5,dp.y-3,3.5,0,7);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.arc(dp.x-5,dp.y-3,1.6,0,7);cx.arc(dp.x+5,dp.y-3,1.6,0,7);cx.fill();
   txt((pl[k]||[''])[0],dp.x,dp.y-24,13,'#fff');if(q[4])txt('😜',dp.x,dp.y-38,22,'#fff');if(q[5])txt('🏁',dp.x,dp.y+30,16,'#fff')});
 }
 PA=PA.filter(function(p){p.l-=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;cx.globalAlpha=Math.max(0,p.l*1.4);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,5,5);cx.globalAlpha=1;return p.l>0});
 hud(ph,id,pl,P);
}
function txt(t,x,y,s,c,w){cx.font=(w||'800')+' '+s+'px system-ui,sans-serif';cx.fillStyle=c;cx.fillText(t,x,y)}
function arena(id){
 if(id==1){var r=st.R||200,gr=cx.createRadialGradient(W/2,H/2,10,W/2,H/2,r);gr.addColorStop(0,'#a3e635');gr.addColorStop(1,'#65a30d');cx.fillStyle='#0c4a6e';cx.fillRect(0,0,W,H);
  for(var i=0;i<8;i++){cx.strokeStyle='rgba(125,211,252,.25)';cx.beginPath();cx.arc(W/2,H/2,r+12+i*14+Math.sin(tm*2+i)*4,0,7);cx.stroke()}
  cx.shadowColor='#bef264';cx.shadowBlur=25;cx.fillStyle=gr;cx.beginPath();cx.arc(W/2,H/2,r,0,7);cx.fill();cx.shadowBlur=0}
 else if(id==22){cx.fillStyle='#bae6fd';cx.fillRect(0,0,W,H);for(var i=0;i<20;i++){cx.fillStyle='#e0f2fe';cx.fillRect((i*80+tm*10)%W,(i*53)%H,50,6)}
  for(var y=0;y<H;y+=20){cx.fillStyle=(y/20)%2?'#111':'#fff';cx.fillRect(W-24,y,12,20);cx.fillStyle=(y/20)%2?'#fff':'#111';cx.fillRect(W-12,y,12,20)}}
 else if(id==29){cx.fillStyle='#7c2d12';cx.fillRect(0,0,W,H);for(var x=-40;x<W;x+=40){cx.fillStyle='#9a3412';cx.fillRect((x+tm*95)%(W+40)-40,0,20,H)}}
 else if(id==48){cx.fillStyle='#0f172a';cx.fillRect(0,0,W,H);cx.strokeStyle='#1e3a5f';for(var x=0;x<W;x+=50){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}for(var y=0;y<H;y+=50){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}}
 else{cx.fillStyle='#1e1b4b';cx.fillRect(0,0,W,H);cx.strokeStyle='#4c1d95';cx.lineWidth=2;cx.strokeRect(4,4,W-8,H-8)}
}
function rows(a,y,hl){a.slice(0,8).forEach(function(r,i){var yy=y+i*34;cx.fillStyle=r.col+'cc';cx.fillRect(W/2-250,yy-22,500,30);cx.textAlign='left';txt((i+1)+'. '+r.n,W/2-240,yy,18,'#fff');cx.textAlign='center';txt(hl?'+'+r.pts:'',W/2+120,yy,18,'#fde047');txt(r.tot+' poin',W/2+205,yy,18,'#fff')})}
function hud(ph,id,pl,P){
 var tg=st.tg||0;
 if(ph==='lobby'){txt('🔥 TIM RUSUH',W/2,70,48,'#fbbf24');txt('Room '+st.rm,W/2,110,26,'#fff');txt((st.mode==='team'?'Mode TIM':'Mode INDIVIDU')+' · target '+tg+' poin',W/2,140,18,'#c4b5fd');
  Object.keys(pl).forEach(function(k,i){var x=120+(i%4)*190,y=200+Math.floor(i/4)*70;cx.fillStyle=pl[k][1];cx.beginPath();cx.arc(x,y,20+Math.sin(tm*3+i)*2,0,7);cx.fill();txt(pl[k][0],x,y+42,16,'#fff')});
  txt(st.msg||(HOST?'Tunggu pemain masuk, lalu tekan MULAI':'Menunggu Game Master memulai…'),W/2,H-30,18,st.msg?'#fca5a5':'#ddd');return}
 if(ph==='intro'){cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(0,0,W,H);txt('MINIGAME',W/2,120,22,'#c4b5fd');txt(CAT[id-1],W/2,190,56,'#fde047');
  wrap(DESC[id]||'',W/2,245,620,24);txt(st.t,W/2,H-60,64,'#fff');return}
 if(ph==='play'){txt(CAT[id-1],14+80,26,18,'#fff');cx.textAlign='left';txt('⏱ '+st.t+'s',14,50,22,'#fde047');cx.textAlign='center';
  var a=Object.keys(P).sort(function(x,y){return P[y][3]-P[x][3]});if(id==29||id==48)a.slice(0,5).forEach(function(k,i){cx.textAlign='right';txt(pl[k][0]+' '+P[k][3],W-10,26+i*22,16,pl[k][1]);cx.textAlign='center'});return}
 if(ph==='res'){cx.fillStyle='rgba(0,0,0,.65)';cx.fillRect(0,0,W,H);txt('HASIL — '+CAT[id-1],W/2,60,30,'#fde047');txt('Poin sementara · target '+tg,W/2,90,16,'#c4b5fd');rows(st.res||[],140,1);txt('Lanjut '+st.t+'…',W/2,H-20,16,'#ddd');return}
 if(ph==='end'){cx.fillStyle='rgba(0,0,0,.7)';cx.fillRect(0,0,W,H);txt('🏆 PEMENANG 🏆',W/2,60,38,'#fde047');var f=st.fin||[],med=['🥇','🥈','🥉'];
  f.slice(0,3).forEach(function(r,i){var y=120+i*80;cx.fillStyle=r.col+'cc';cx.fillRect(W/2-270,y-34,540,66);txt(med[i],W/2-230,y+12,44,'#fff');txt(r.n+' · '+r.tot+' poin',W/2+20,y-2,26,'#fff');txt(r.pl,W/2+20,y+22,14,'#eee')});
  f.slice(3,6).forEach(function(r,i){txt((i+4)+'. '+r.n+' — '+r.tot,W/2,370+i*22,16,'#ccc')});
  for(var i=0;i<3;i++)PA.push({x:rnd(0,W),y:-5,vx:rnd(-30,30),vy:rnd(80,200),l:3,c:PC[Math.random()*12|0]})}
}
function wrap(t,x,y,mw,lh){var w=t.split(' '),l='';w.forEach(function(s){var n=l+s+' ';cx.font='600 20px system-ui';if(cx.measureText(n).width>mw){txt(l,x,y,20,'#fff','600');y+=lh;l=s+' '}else l=n});txt(l,x,y,20,'#fff','600')}
</script></body></html>
